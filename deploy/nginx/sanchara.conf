# nginx site for Sanchara on the shared VPS: /etc/nginx/sites-available/sanchara,
# linked from sites-enabled. certbot --nginx adds the HTTPS server and the
# HTTP-to-HTTPS redirect to the installed copy. Every hostname is served by the
# web container; it picks the central site, Back Office, admin or a company site
# from the Host header. A new company subdomain also needs its name here and on
# the certificate (certbot --expand).
server {
    listen 80;
    listen [::]:80;
    server_name sanchara.srv1187898.hstgr.cloud
                www.sanchara.srv1187898.hstgr.cloud
                backoffice.sanchara.srv1187898.hstgr.cloud
                admin.sanchara.srv1187898.hstgr.cloud
                demo.sanchara.srv1187898.hstgr.cloud;

    # Property logos are up to 2 MB (Server Actions accept 3 MB).
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
